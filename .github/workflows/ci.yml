name: packages-ci

# CI for the RuleAtlas packages repository (this directory becomes the repo root).
# Each Python package is linted, type-checked, tested, and built standalone from the uv workspace.
# (The React component library lives in its own repository: SignalSafeSoftware/ruleatlas-ui.)

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [contracts, persistence, discovery-core, claims, extraction, exports, ai, demo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Sync (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: uv sync --all-extras
      - name: Ruff (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: uv run --all-extras ruff check src
      - name: Mypy (${{ matrix.package }}, if configured)
        working-directory: ${{ matrix.package }}
        run: if grep -q '\[tool.mypy\]' pyproject.toml; then uv run --all-extras mypy src; else echo "no mypy config - skipping"; fi
      - name: Pytest (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: uv run --all-extras python -m pytest -q
      - name: Build wheel + sdist (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: uv build --out-dir "$PWD/dist"

  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-extras
      - name: Enforce cross-package DAG
        run: uv run --with 'import-linter<2.0' lint-imports --config .importlinter
