name: packages-ci

# CI for the RuleAtlas packages repository (this directory becomes the repo root).
# Each Python package is linted, type-checked, tested, and built standalone from the uv workspace.
# (The React component library lives in its own repository: SignalSafeSoftware/ruleatlas-ui.)

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [contracts, persistence, discovery-core, claims, extraction, exports, ai, demo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Sync (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: |
          uv venv --seed
          uv export --all-extras --frozen --group dev --no-emit-project --no-emit-workspace -o requirements.txt
          uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r requirements.txt
          uv build --all-packages --wheel --out-dir "${RUNNER_TEMP}/ra-wheels" "${GITHUB_WORKSPACE}"
          python "${GITHUB_WORKSPACE}/scripts/hash_local_wheels.py" "${RUNNER_TEMP}/ra-wheels" -o "${RUNNER_TEMP}/ra-wheels.txt"
          uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r "${RUNNER_TEMP}/ra-wheels.txt"
      - name: Ruff (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: .venv/bin/ruff check src
      - name: Mypy (${{ matrix.package }}, if configured)
        working-directory: ${{ matrix.package }}
        run: if grep -q '\[tool.mypy\]' pyproject.toml; then .venv/bin/mypy src; else echo "no mypy config - skipping"; fi
      - name: Pytest with source coverage (${{ matrix.package }})
        env:
          COVERAGE_SOURCE: ${{ matrix.package }}/src
          COVERAGE_FILE: .coverage.${{ matrix.package }}
        run: |
          "${{ matrix.package }}/.venv/bin/python" -m coverage run -m pytest -q -c "${{ matrix.package }}/pyproject.toml" "${{ matrix.package }}/tests"
          "${{ matrix.package }}/.venv/bin/python" -m coverage xml -o "coverage-reports/${{ matrix.package }}.xml"
      - name: Upload source coverage (${{ matrix.package }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.package }}
          path: coverage-reports/${{ matrix.package }}.xml
          if-no-files-found: error
      - name: Build wheel + sdist (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: uv build --out-dir "$PWD/dist"

  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: |
          uv venv --seed
          uv export --all-extras --frozen --group dev --no-emit-workspace -o requirements.txt
          uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r requirements.txt
          uv build --all-packages --wheel --out-dir "${RUNNER_TEMP}/ra-wheels" .
          python scripts/hash_local_wheels.py "${RUNNER_TEMP}/ra-wheels" -o "${RUNNER_TEMP}/ra-wheels.txt"
          uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r "${RUNNER_TEMP}/ra-wheels.txt"
      - name: Enforce cross-package DAG
        run: .venv/bin/lint-imports --config .importlinter
      - name: Test packaging scripts with source coverage
        env:
          COVERAGE_SOURCE: scripts
          COVERAGE_FILE: .coverage.scripts
        run: |
          .venv/bin/python -m coverage run -m unittest scripts.test_verify_release_tag scripts.test_hash_local_wheels
          .venv/bin/python -m coverage xml -o coverage-reports/scripts.xml
      - name: Upload packaging script coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-scripts
          path: coverage-reports/scripts.xml
          if-no-files-found: error

  sonar:
    needs: [python, import-linter]
    if: github.repository == 'SignalSafeSoftware/ruleatlas-packages' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: true
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.PACKAGES_SONAR_TOKEN }}
