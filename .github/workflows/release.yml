name: release

# Publishes one RuleAtlas package after a package-specific version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no long-lived token. One-time setup per package on PyPI:
#   PyPI > project > Publishing > add a GitHub trusted publisher with
#     owner: SignalSafeSoftware, repo: ruleatlas-packages, workflow: release.yml, environment: pypi
# Example: contracts-v0.1.0 publishes only the contracts package after validating
# that its source version is 0.1.0.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing approved package version tag to retry without moving it
        required: true
        type: string
  push:
    tags:
      - "contracts-v*"
      - "persistence-v*"
      - "discovery-core-v*"
      - "claims-v*"
      - "extraction-v*"
      - "exports-v*"
      - "ai-v*"
      - "demo-v*"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Test release tag script
        run: python -m unittest scripts.test_verify_release_tag scripts.test_hash_local_wheels
      - name: Validate release tag
        id: tag
        run: |
          python scripts/verify-release-tag.py "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Sync workspace
        run: |
          uv venv --seed
          uv export --all-extras --frozen --group dev --no-emit-workspace -o requirements.txt
          uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r requirements.txt
          uv build --all-packages --wheel --out-dir "${RUNNER_TEMP}/ra-wheels" .
          python scripts/hash_local_wheels.py "${RUNNER_TEMP}/ra-wheels" -o "${RUNNER_TEMP}/ra-wheels.txt"
          uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r "${RUNNER_TEMP}/ra-wheels.txt"
      - name: Enforce cross-package DAG
        run: .venv/bin/lint-imports --config .importlinter
      - name: Validate all packages
        run: |
          for package in contracts persistence discovery-core claims extraction exports ai demo; do
            (
              cd "$package"
              uv venv --seed
              uv export --all-extras --frozen --no-emit-project --no-emit-workspace -o requirements.txt
              uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r requirements.txt
              uv build --all-packages --wheel --out-dir "${RUNNER_TEMP}/ra-wheels-${package}" "${GITHUB_WORKSPACE}"
              python "${GITHUB_WORKSPACE}/scripts/hash_local_wheels.py" "${RUNNER_TEMP}/ra-wheels-${package}" -o "${RUNNER_TEMP}/ra-wheels-${package}.txt"
              uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r "${RUNNER_TEMP}/ra-wheels-${package}.txt"
              .venv/bin/ruff check src
              if grep -q '\[tool.mypy\]' pyproject.toml; then .venv/bin/mypy src; fi
              .venv/bin/python -m pytest -q
              uv build --out-dir "$PWD/dist"
            )
          done

  pypi:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Build ${{ needs.validate.outputs.package }}
        working-directory: ${{ needs.validate.outputs.package }}
        run: uv build --out-dir "$PWD/dist"
      - name: Publish ${{ needs.validate.outputs.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ needs.validate.outputs.package }}/dist
