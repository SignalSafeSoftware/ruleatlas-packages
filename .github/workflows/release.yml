name: release

# Publishes one RuleAtlas package after a package-specific version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no long-lived token. One-time setup per package on PyPI:
#   PyPI > project > Publishing > add a GitHub trusted publisher with
#     owner: SignalSafeSoftware, repo: ruleatlas-packages, workflow: release.yml, environment: pypi
# Example: contracts-v0.1.0 publishes only the contracts package after validating
# that its source version is 0.1.0.

on:
  push:
    tags:
      - "contracts-v*"
      - "persistence-v*"
      - "discovery-core-v*"
      - "claims-v*"
      - "extraction-v*"
      - "exports-v*"
      - "ai-v*"
      - "demo-v*"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
      - name: Test release tag script
        run: python -m unittest scripts.test_verify_release_tag
      - name: Validate release tag
        id: tag
        run: python scripts/verify-release-tag.py "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Sync workspace
        run: |
          uv venv --seed
          uv export --all-extras --frozen --group dev --no-emit-workspace -o requirements.txt
          uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r requirements.txt
          uv build --all-packages --wheel --out-dir "${RUNNER_TEMP}/ra-wheels" .
          uv pip install --python .venv/bin/python --no-build --no-deps "${RUNNER_TEMP}/ra-wheels"/*.whl
      - name: Enforce cross-package DAG
        run: .venv/bin/lint-imports --config .importlinter
      - name: Validate all packages
        run: |
          for package in contracts persistence discovery-core claims extraction exports ai demo; do
            (
              cd "$package"
              uv venv --seed
              uv export --all-extras --frozen --no-emit-project --no-emit-workspace -o requirements.txt
              uv pip install --python .venv/bin/python --require-hashes --no-build --no-deps -r requirements.txt
              uv build --all-packages --wheel --out-dir "${RUNNER_TEMP}/ra-wheels-${package}" "${GITHUB_WORKSPACE}"
              uv pip install --python .venv/bin/python --no-build --no-deps "${RUNNER_TEMP}/ra-wheels-${package}"/*.whl
              .venv/bin/ruff check src
              if grep -q '\[tool.mypy\]' pyproject.toml; then .venv/bin/mypy src; fi
              .venv/bin/python -m pytest -q
              uv build --out-dir "$PWD/dist"
            )
          done

  pypi:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
      - name: Build ${{ needs.validate.outputs.package }}
        working-directory: ${{ needs.validate.outputs.package }}
        run: uv build --out-dir "$PWD/dist"
      - name: Publish ${{ needs.validate.outputs.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # release/v1
        with:
          packages-dir: ${{ needs.validate.outputs.package }}/dist
